# Retromarchy Configuration Example
# Copy this to ~/.config/retromarchy/config.toml and adjust paths

# theme = "system" follows the Omarchy theme. "launchbox" is the built-in dark theme.
# Options → Theme and the t key toggle it.
# theme = "system"

# Sidebar order. "name" (the default) is alphabetical by display name.
# "year" is each system's first-region launch year. Unknown years sort last,
# and ties fall back to the name. Consoles stay in the order they were added.
# The Systems header Name/Year control and the o key toggle it.
# system_sort = "name"

# One cover width for every system's game grid, in pixels.
# The GPUI shell slider and - / + keys step by 10 between 120 and 400.
# cover_width = 216

# Emulators are installed programs. Each RetroArch install is its own entry.
# Launch is: path, global_args, then `-L <core>` for RetroArch, then extra_args, then the ROM.
# `{rom}` in global_args or extra_args is replaced, and the ROM is not added again.
# `config` is that install's retroarch.cfg. Leave it out to derive the path from `path`.
# Cores are read from that cfg's libretro_directory.
[[emulators]]
id = "retroarch"
name = "RetroArch"
kind = "RetroArch"
path = "retroarch"
global_args = ""
# config = "/home/user/.config/retroarch/retroarch.cfg"

[[emulators]]
id = "dolphin"
name = "Dolphin"
kind = "Standalone"
path = "dolphin-emu"
global_args = "-b -e {rom}"

[[emulators]]
id = "pcsx2"
name = "PCSX2"
kind = "Standalone"
path = "pcsx2"
global_args = "--fullscreen"

# Console definitions.
# rom_dirs is a list, so one system can scan more than one folder.
# A hand-edited rom_dir string or array still loads, and the next save writes rom_dirs.
# ~ and ~/... expand with HOME when a folder is added and again when it is scanned.
[[consoles]]
id = "snes"
name = "Super Nintendo"
rom_dirs = ["/home/user/roms/snes", "/home/user/roms/snes-translations"]
extensions = ["sfc", "smc", "zip"]
emulator = "retroarch"
core = "/usr/lib/libretro/snes9x_libretro.so"
extra_args = ""
grid_art = "box_art"

[consoles.media]
box_art = true
screenshot = true
manual = false
video = false

[[consoles]]
id = "genesis"
name = "Sega Genesis"
rom_dirs = ["/home/user/roms/genesis"]
extensions = ["md", "bin", "zip"]
emulator = "retroarch"
core = "/usr/lib/libretro/genesis_plus_gx_libretro.so"

[consoles.media]
box_art = true
screenshot = true
manual = false
video = false

[[consoles]]
id = "gamecube"
name = "Nintendo GameCube"
rom_dirs = ["/home/user/roms/gamecube"]
extensions = ["iso", "gcm"]
emulator = "dolphin"

[consoles.media]
box_art = true
screenshot = false
manual = false
video = false

# Hold-repeat for arrow keys, the d-pad, and the left stick.
# The Options button edits this.
# Hold-repeat uses the saved values immediately.
# Confirm, Back, and Favorite do not repeat.
[input]
initial_delay_ms = 400
slow_interval_ms = 180
fast_interval_ms = 50
ramp_ms = 2000

# Artwork scraper. Hand-edit this, or open Options → Scraper (Ctrl+G).
# Images are cached under ~/.local/share/retromarchy/media/.
# The scraper never downloads ROMs or BIOS.
# Shift+S and Manage Systems → Scrape Missing use this section.
# A ROM scan that finds new games runs that scrape for the new games only.
# Artwork already stored for a game is not fetched again.
[scraper]
box_art = true
screenshot = true

[[scraper.providers]]
id = "screenscraper"
enabled = true

[[scraper.providers]]
id = "thegamesdb"
enabled = true

[scraper.credentials]
screenscraper_user = ""
screenscraper_password = ""
thegamesdb_api_key = ""

# Per console, grid_art is box_art or screenshot (default box_art).
# An older title_screen value is read as box_art.
# [[consoles]]
# grid_art = "box_art"

# Media discovery convention:
# Box art: <rom_name>.png/jpg/jpeg in same dir or box_art/ subdir
# Screenshot: <rom_name>.png/jpg/jpeg in same dir or screenshot/ subdir
# Manual: <rom_name>.pdf/txt in same dir or manual/ subdir
# Video: <rom_name>.mp4/mkv/avi in same dir or video/ subdir
