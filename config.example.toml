# Retromarchy Configuration Example
# Copy this to ~/.config/retromarchy/config.toml and adjust paths

# One cover width for every system's game grid, in pixels.
# The GPUI shell slider and - / + keys step by 10 between 120 and 400.
# cover_width = 216

# Emulator profiles define how to launch games
[[profiles]]
type = "RetroArch"
id = "retroarch-snes9x"
core = "/usr/lib/libretro/snes9x_libretro.so"
# config = "/home/user/.config/retroarch/snes.cfg"  # Optional

[[profiles]]
type = "RetroArch"
id = "retroarch-genesis-plus-gx"
core = "/usr/lib/libretro/genesis_plus_gx_libretro.so"

[[profiles]]
type = "Standalone"
id = "dolphin"
command = "dolphin-emu -b -e {rom}"

[[profiles]]
type = "Standalone"
id = "pcsx2"
command = "pcsx2 --fullscreen {rom}"

# Console definitions
[[consoles]]
id = "snes"
name = "Super Nintendo"
rom_dirs = ["/home/user/roms/snes"]
extensions = ["sfc", "smc", "zip"]
profile = "retroarch-snes9x"
grid_art = "box_art"

[consoles.media]
box_art = true
screenshot = true
manual = false
video = false

[[consoles]]
id = "genesis"
name = "Sega Genesis"
rom_dirs = ["/home/user/roms/genesis"]
extensions = ["md", "bin", "zip"]
profile = "retroarch-genesis-plus-gx"

[consoles.media]
box_art = true
screenshot = true
manual = false
video = false

[[consoles]]
id = "gamecube"
name = "Nintendo GameCube"
rom_dirs = ["/home/user/roms/gamecube"]
extensions = ["iso", "gcm"]
profile = "dolphin"

[consoles.media]
box_art = true
screenshot = false
manual = false
video = false

# Hold-repeat for arrow keys, the d-pad, and the left stick.
# GTK Options → Input edits this. The GPUI shell reads it at startup.
# Confirm, Back, and Favorite do not repeat.
[input]
initial_delay_ms = 400
slow_interval_ms = 180
fast_interval_ms = 50
ramp_ms = 2000

# Artwork scraper. Hand-edit this, or use Scraper in the app.
# Images are cached under ~/.local/share/retromarchy/media/.
# The scraper never downloads ROMs or BIOS.
[scraper]
box_art = true
screenshot = true

[[scraper.providers]]
id = "screenscraper"
enabled = true

[[scraper.providers]]
id = "thegamesdb"
enabled = true

[scraper.credentials]
screenscraper_user = ""
screenscraper_password = ""
thegamesdb_api_key = ""

# Per console, grid_art is box_art or screenshot (default box_art).
# An older title_screen value is read as box_art.
# [[consoles]]
# grid_art = "box_art"

# Media discovery convention:
# Box art: <rom_name>.png/jpg/jpeg in same dir or box_art/ subdir
# Screenshot: <rom_name>.png/jpg/jpeg in same dir or screenshot/ subdir
# Manual: <rom_name>.pdf/txt in same dir or manual/ subdir
# Video: <rom_name>.mp4/mkv/avi in same dir or video/ subdir
