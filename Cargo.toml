[package]
name = "retromarchy"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5.11"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
xdg = "2.5"
anyhow = "1.0"
regex = "1.10"
shell-words = "1.1"
ureq = "2.12"
gilrs = "0.11"
gpui-kit = { version = "=0.6.1", default-features = false, features = ["assets"] }
gpui-omarchy = "=0.1.2"
# gpui-kit 0.6.1 writes these as 0.6.1, and Cargo treats that as ^0.6.1.
# gpui-base 0.6.6 dropped TilesRenderer, so gpui-omarchy 0.1.2 does not compile against it.
gpui-base = "=0.6.1"
gpui-kit-assets = "=0.6.1"

[dev-dependencies]
tempfile = "3.12"
